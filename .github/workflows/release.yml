name: Release

# À chaque tag vX.Y.Z : compile l'installeur Windows, le signe pour les mises à jour automatiques,
# puis publie une Release GitHub avec l'installeur, sa signature et latest.json.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dépendances
        run: npm ci

      - name: Numéro de version cohérent avec le tag
        run: node scripts/sync-version.mjs --check "${{ github.ref_name }}"

      - name: Tests de l'interface
        run: npm test

      - name: Notes de version
        id: notes
        shell: bash
        run: |
          {
            echo "body<<GL_NOTES_EOF"
            node scripts/release-notes.mjs "${{ github.ref_name }}"
            echo
            echo "GL_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compilation, signature et publication
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GameLauncher ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
